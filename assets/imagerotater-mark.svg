<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">ImageRotater</title>
  <desc id="d">Three stacked image cards in a blue and lavender style on a transparent background.</desc>
  <defs>
    <linearGradient id="backCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173CFF"/>
      <stop offset="1" stop-color="#1BAAF6"/>
    </linearGradient>
    <linearGradient id="midCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1570F8"/>
      <stop offset="1" stop-color="#35C8F3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F5DFF"/>
      <stop offset="1" stop-color="#D7A4F7"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2CC5F2"/>
      <stop offset="1" stop-color="#1665FF"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1550FF"/>
      <stop offset="1" stop-color="#0D1ED8"/>
    </linearGradient>
  </defs>
  <g transform="translate(128 136) rotate(-6)">
    <g transform="translate(-18 -14) rotate(-8)">
      <rect x="-68" y="-54" width="138" height="98" rx="16" fill="none" stroke="#F7F9FF" stroke-width="10"/>
      <rect x="-62" y="-48" width="126" height="86" rx="10" fill="url(#backCard)"/>
    </g>
    <g transform="translate(6 4) rotate(-4)">
      <rect x="-68" y="-54" width="138" height="98" rx="16" fill="none" stroke="#F7F9FF" stroke-width="10"/>
      <rect x="-62" y="-48" width="126" height="86" rx="10" fill="url(#midCard)"/>
    </g>
    <g>
      <rect x="-68" y="-54" width="138" height="98" rx="16" fill="none" stroke="#F7F9FF" stroke-width="10"/>
      <clipPath id="frontClip"><rect x="-62" y="-48" width="126" height="86" rx="10"/></clipPath>
      <g clip-path="url(#frontClip)">
        <rect x="-62" y="-48" width="126" height="86" fill="url(#sky)"/>
        <circle cx="-18" cy="-8" r="18" fill="#F6F2FF"/>
        <path d="M -62 52 L 6 0 L 64 52 Z" fill="url(#hillA)"/>
        <path d="M -44 46 L 6 0 L 66 52 L 66 88 L -44 88 Z" fill="url(#hillB)"/>
      </g>
    </g>
  </g>
</svg>